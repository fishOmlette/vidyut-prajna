services:
  - type: web
    name: vidyut-prajna
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.dashboard.app:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: DEBUG
        value: "false"

